<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content tells the browser to actually
         shrink the layout viewport when the on-screen keyboard opens,
         instead of leaving it full-height with the keyboard just overlaid
         on top — that mismatch is what pushes the chat input off-screen or
         behind the keyboard on Android/iOS. Supported on modern Chrome/
         Android WebView; ignored harmlessly elsewhere, where the dvh units
         below carry the fix instead. viewport-fit=cover is required for
         env(safe-area-inset-*) to resolve to anything but 0 — without it
         every safe-area rule in the CSS is silently a no-op on notch/
         Dynamic-Island/home-indicator devices. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Jennysol AI — a retrieval-augmented chat assistant. Upload documents and ask questions grounded in them." />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Jennysol AI</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      try {
        const stored = localStorage.getItem("jennysol-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
